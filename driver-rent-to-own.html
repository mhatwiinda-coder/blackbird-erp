<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent-to-Own Portal - BLACK BIRD</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #F28C28;
            --gold2: #ffa94d;
            --dark: #07090d;
            --dark2: #0d1017;
            --dark3: #121620;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #e8eaf0;
            --text2: #8a90a8;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --success: #27ae60;
            --warning: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 50%, var(--dark3) 100%);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(7, 9, 13, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--gold);
            font-family: var(--font-display);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text2);
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .back-btn {
            color: var(--text2);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: var(--gold);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-family: var(--font-display);
            color: var(--gold);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--text2);
        }

        .agreements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .agreement-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .agreement-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--gold);
            transform: translateY(-3px);
        }

        .vehicle-info {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .vehicle-icon {
            font-size: 2.5rem;
            color: var(--gold);
        }

        .vehicle-details h3 {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .vehicle-details p {
            font-size: 0.9rem;
            color: var(--text2);
        }

        .agreement-details {
            background: rgba(242, 140, 40, 0.05);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 3px solid var(--gold);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.95rem;
        }

        .detail-row .label {
            color: var(--text2);
        }

        .detail-row .value {
            color: var(--text);
            font-weight: 600;
        }

        .progress-section {
            margin-bottom: 1.5rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .progress-label .label {
            color: var(--text2);
        }

        .progress-label .percentage {
            color: var(--gold);
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold2) 100%);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }

        .status-active {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-completed {
            background: rgba(242, 140, 40, 0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        .status-defaulted {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
            color: var(--dark);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(242, 140, 40, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--gold);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text2);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .empty-state h2 {
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text2);
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text2);
        }

        .spinner {
            border: 3px solid rgba(242, 140, 40, 0.2);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 1.8rem;
            }

            .agreements-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/driver-login" class="logo">
            <i class="fas fa-car"></i>
            BLACK BIRD
        </a>
        <nav class="nav-links">
            <a href="/driver">Payment Submissions</a>
            <a href="/driver-earnings">Earnings</a>
            <a href="/driver-login" class="back-btn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-car"></i> Rent-to-Own Agreements</h1>
            <p>View your vehicle purchase agreements and payment progress</p>
        </div>

        <div id="agreements-container" class="agreements-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your agreements...</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BLACK BIRD Logistics. All rights reserved.</p>
    </footer>

    <script>
        // =========== SUPABASE CLIENT ===========
        const SB_URL = 'https://cwuogdcxckenebarxsjd.supabase.co';
        const SB_KEY = 'sb_publishable_pxYuv_yRuE0r6zI0etWDHg_tEkb9ttT';
        const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };

        async function sbFetch(path, opts = {}) {
            const url = SB_URL + path;
            const method = opts.method || 'GET';
            const headers = { ...SB_HEADERS, ...opts.headers };
            return fetch(url, { method, headers, body: opts.body ? JSON.stringify(opts.body) : null })
                .then(r => r.json());
        }

        let driverId = null;
        let token = null;

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            const storedDriverId = localStorage.getItem('driverId');
            const storedToken = localStorage.getItem('driverToken');

            if (!storedDriverId || !storedToken) {
                showEmptyState();
                return;
            }

            driverId = storedDriverId;
            token = storedToken;
            loadAgreements();
        });

        function loadAgreements() {
            // Use Supabase REST API to fetch rent-to-own agreements
            sbFetch(`/rest/v1/rent_to_own_agreements?driver_id=eq.${driverId}&select=*`, {
                headers: {
                    'Authorization': `Bearer ${SB_KEY}`
                }
            })
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    renderAgreements(data);
                } else {
                    showEmptyState();
                }
            })
            .catch(err => {
                console.error('Error loading agreements:', err);
                showError('Failed to load agreements. Please refresh.');
            });
        }

        function renderAgreements(agreements) {
            const container = document.getElementById('agreements-container');
            container.innerHTML = agreements.map(agreement => {
                const progress = (agreement.paid_amount / agreement.total_price) * 100;
                const statusClass = `status-${agreement.agreement_status.toLowerCase()}`;

                return `
                    <div class="agreement-card">
                        <div class="status-badge ${statusClass}">
                            ${agreement.agreement_status}
                        </div>

                        <div class="vehicle-info">
                            <div class="vehicle-icon">
                                <i class="fas fa-car"></i>
                            </div>
                            <div class="vehicle-details">
                                <h3>${agreement.vehicle_name || 'Vehicle'}</h3>
                                <p>Plate: ${agreement.plate_number || 'N/A'}</p>
                            </div>
                        </div>

                        <div class="agreement-details">
                            <div class="detail-row">
                                <span class="label">Total Price:</span>
                                <span class="value">ZMW ${parseFloat(agreement.total_price).toLocaleString()}</span>
                            </div>
                            <div class="detail-row">
                                <span class="label">Paid Amount:</span>
                                <span class="value">ZMW ${parseFloat(agreement.paid_amount).toLocaleString()}</span>
                            </div>
                            <div class="detail-row">
                                <span class="label">Remaining:</span>
                                <span class="value">ZMW ${parseFloat(agreement.remaining_balance).toLocaleString()}</span>
                            </div>
                            <div class="detail-row">
                                <span class="label">Started:</span>
                                <span class="value">${new Date(agreement.agreement_date).toLocaleDateString()}</span>
                            </div>
                        </div>

                        <div class="progress-section">
                            <div class="progress-label">
                                <span class="label">Payment Progress</span>
                                <span class="percentage">${progress.toFixed(1)}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="viewDetails('${agreement.id}')">
                                <i class="fas fa-eye"></i>
                                View Details
                            </button>
                            ${agreement.agreement_status === 'Active' ? `
                                <button class="btn btn-secondary" onclick="viewPaymentHistory('${agreement.id}')">
                                    <i class="fas fa-history"></i>
                                    History
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showEmptyState() {
            document.getElementById('agreements-container').innerHTML = `
                <div style="grid-column: 1 / -1;">
                    <div class="empty-state">
                        <i class="fas fa-car"></i>
                        <h2>No Rent-to-Own Agreements</h2>
                        <p>You don't have any vehicle purchase agreements yet. Contact your administrator to set one up.</p>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('agreements-container').innerHTML = `
                <div style="grid-column: 1 / -1;">
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Error</h2>
                        <p>${message}</p>
                    </div>
                </div>
            `;
        }

        function viewDetails(agreementId) {
            alert('Detailed view coming soon!');
        }

        function viewPaymentHistory(agreementId) {
            alert('Payment history coming soon!');
        }
    </script>
</body>
</html>
